name: Bug report
description: Something in NV+ doesn't work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per report, please. Screenshots are welcome; game files, saves and recordings are
        not. Before pasting a log or error, remove your user name and folder paths.
  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      options:
        - Launcher
        - Starting the game
        - Playing the game
        - Settings
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NV+ version
      description: Type what the bottom of the launcher shows after "NV+", even if it says "dev".
      placeholder: e.g. 1a2b3c4
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: How you run it
      options:
        - Windows 11
        - Windows 10
        - Windows (other)
        - Linux with Proton
        - Linux with Wine
        - Steam Deck
        - Something else
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Where your copy of the game is from
      options:
        - Steam
        - GOG
        - Epic
        - Somewhere else
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often it happens
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: Where you were in the game and what you did, step by step.
      placeholder: |
        1. Start a new game
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: More about your setup
      description: Optional. Graphics card and driver, Proton or Wine version, anything else that seems related.
      placeholder: e.g. RTX 4070, driver 566.36, Proton Experimental
  - type: textarea
    id: log
    attributes:
      label: Error message or log
      description: Paste only the lines that matter, with your user name and folder paths removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the open issues and this isn't one of them.
          required: true
