[package]
name = "nv-plus-notices"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Writes the NV+ launcher's third-party notices and licence files."

[[bin]]
name = "nv-plus-notices"
path = "src/main.rs"

[lib]
name = "nv_plus_notices"
path = "src/lib.rs"

# Standalone crate, not part of the root workspace, so it keeps its own lock file.
[workspace]

[dependencies]
serde_json = "1.0.154"
